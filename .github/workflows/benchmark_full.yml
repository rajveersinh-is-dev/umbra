name: Full Benchmark Suite & Publication Figures

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC

jobs:
  run-full-benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[all]"

    - name: Run Full Monte Carlo Benchmark Suite
      run: |
        python scripts/reproduce_benchmarks.py --full

    - name: Generate Publication Figures (PNG & PDF)
      run: |
        python scripts/generate_figures.py --output-dir benchmarks/figures

    - name: Run Real-World Case Studies
      run: |
        python scripts/reproduce_case_studies.py

    - name: Upload Benchmark Results & Leaderboards
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          benchmarks/results.md
          benchmarks/figures/*.png
          benchmarks/figures/*.pdf
          docs/case_studies/*.md
